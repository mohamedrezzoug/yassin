<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c8599">
<meta name="description" content="جزيرة ياسين: تطبيق تعليمي وترفيهي للأطفال بأربع لغات">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>جزيرة ياسين</title>
<style>
@font-face{font-family:'Baloo Bhaijaan 2';src:url('fonts/Baloo.ttf') format('truetype');font-weight:400 800;font-display:swap}
@font-face{font-family:'Cairo';src:url('fonts/Cairo.ttf') format('truetype');font-weight:200 1000;font-display:swap}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;font-size:14px}
/* Layout: adventure-island map — teal sea bar on top, living canvas island, sand-colored sheet of big round buttons below */
:root{--sea:#0c8599;--sea-d:#0b6e7f;--sand:#fff4d6;--sand-2:#ffe8a3;--coral:#ff6b6b;--ink:#0b3d4a;--leaf:#2f9e44;--sheet:#fffdf6;--soft:#e6fcf5;--muted:#5c7c85;--good:#2f9e44;--bad:#e03131;
  --display:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif;--body:'Cairo',system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.bar{position:relative;z-index:30;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--sea),var(--sea-d));color:#fff}
.bar h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,30px);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ib{border:0;background:rgba(255,255,255,.18);color:#fff;min-width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center;font-family:var(--display);font-weight:800;padding:0 10px}
.ib:focus-visible,.tile:focus-visible,.candy:focus-visible,.ans:focus-visible,.chip:focus-visible,.task:focus-visible,.pchip:focus-visible{outline:4px solid #ffd43b;outline-offset:2px}
.lang{display:flex;gap:4px;border-radius:999px;font-size:16px}
.lang svg{width:20px;height:20px}
.stars{display:flex;align-items:center;gap:6px;background:#ffd43b;color:var(--ink);border-radius:999px;padding:3px 14px 3px 10px;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(11,61,74,.3);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:160px}
.langmenu button{border:0;background:transparent;font-family:var(--body);font-weight:800;font-size:18px;color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;text-align:start}
.langmenu button[aria-current="true"]{background:#ffd43b}
.stage{position:relative;flex:1;min-height:150px;overflow:hidden;background:#74c0fc}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.sheet{background:var(--sheet);border-radius:30px 30px 0 0;padding-block:16px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:2;max-height:56%;overflow-y:auto;box-shadow:0 -8px 0 var(--sand-2)}
#s-home{max-height:40%}
.inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;width:100%}
.inner.center{align-items:center;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
#zoneGrid{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.tiles,#zoneGrid{grid-template-columns:repeat(3,1fr)}#zoneGrid{grid-template-columns:repeat(2,1fr)}}
.tile{border:0;border-radius:26px;padding:10px 8px 12px;cursor:pointer;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(15px,2.2vw,20px);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18);line-height:1.25;text-wrap:balance;transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile canvas{width:56px;height:56px}
.tile small{font-family:var(--body);font-weight:600;font-size:13px;opacity:.95}
.tile.soon{filter:saturate(.45);opacity:.75}
.candy{border:0;border-radius:999px;padding:10px 22px;font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer;background:#ffd43b;color:var(--ink);box-shadow:0 5px 0 #e0a800}
.candy.alt{background:var(--soft);box-shadow:0 5px 0 #b2f2e2}
.candy:active{transform:translateY(3px);box-shadow:0 2px 0 #e0a800}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:7px 16px;font-family:var(--body);font-weight:800;font-size:16px;cursor:pointer;background:var(--soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sea);color:#fff}
.q{font-weight:800;font-size:clamp(18px,3vw,26px);text-align:center;margin:0;text-wrap:balance}
.big{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,52px);color:var(--sea);text-align:center;margin:0;line-height:1.2}
.tdesc{margin:0;text-align:center;font-weight:600;font-size:clamp(15px,2.3vw,19px);color:var(--muted)}
.msg{min-height:28px;text-align:center;font-weight:800;font-size:18px;margin:0}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.answers.six{grid-template-columns:repeat(6,1fr)}
.answers.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.answers{grid-template-columns:repeat(2,1fr)}.answers.six{grid-template-columns:repeat(3,1fr)}.answers.two{grid-template-columns:1fr}}
.ans{border:0;border-radius:20px;padding:8px 8px 10px;cursor:pointer;font-family:var(--body);font-weight:800;font-size:17px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 rgba(0,0,0,.12);min-height:64px}
.ans.txt{font-size:clamp(18px,2.8vw,26px)}
.ans.wide{font-size:clamp(16px,2.4vw,20px);line-height:1.5;padding:12px}
.ans.ok{outline:5px solid var(--good)}.ans.no{outline:5px solid var(--bad);animation:shake .4s}
.big-e{font-size:38px;line-height:1.1}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#c3fae8}
.dots i.done{background:#ffd43b}.dots i.miss{background:#ffc9c9}.dots i.now{outline:3px solid var(--sea)}
.meter{height:14px;border-radius:999px;background:var(--soft);overflow:hidden;max-width:520px;width:100%;margin:0 auto}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd43b,#20c997);transition:width .3s}
.prog{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;direction:ltr}
@media (max-width:640px){.prog{grid-template-columns:repeat(7,1fr)}}
.pchip,.pslot{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:20px}
.pchip{border:0;background:#fff4e6;cursor:pointer;box-shadow:0 3px 0 #ffd8a8;padding:0}
.pchip.on{background:#ffd43b}
.pslot{border:2px dashed #c3fae8}
#rbBtns{direction:ltr}
#rbBtns button[data-d]{width:56px;height:56px;border-radius:16px;border:0;background:#d0ebff;font-size:28px;cursor:pointer;box-shadow:0 4px 0 #a5d8ff}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.tasks{grid-template-columns:1fr}}
.task{display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--soft);padding:10px 14px;cursor:pointer;font-family:var(--body);font-weight:800;font-size:18px;color:var(--ink);text-align:start}
.task .te{font-size:30px}.task .tn{flex:1;min-width:0}.task .tc{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#fff;font-size:20px}
.task.on{background:#d3f9d8}.task.on .tc{background:var(--good)}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:900px){.glist{grid-template-columns:1fr 1fr}}
.glist li{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:18px;padding:10px 14px}
.glist li>div:last-child{min-width:0}
.gic{flex:0 0 50px;height:50px;border-radius:16px;background:var(--sea);display:grid;place-items:center;font-size:28px}
.glist h3{margin:0;font-family:var(--display);font-size:19px;color:var(--sea)}
.glist p{margin:2px 0 0;font-weight:600;line-height:1.65;font-size:15px}
#s-guide{max-height:70%}
#s-gen{max-height:58%}
#s-parent{max-height:70%}
button.stars{border:0;cursor:pointer;font-family:var(--body)}
.mission{background:linear-gradient(90deg,#fff3bf,#e6fcf5);border-radius:20px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.mhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--sea)}
.mcount{background:#fff;border-radius:999px;padding:0 12px;font-variant-numeric:tabular-nums}
.mchip.ok{background:#d3f9d8}
.mission .tdesc{font-size:14px}
.stkgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stk{aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:clamp(24px,4vw,36px);opacity:.45}
.stk.got{opacity:1;background:#fff3bf}
.gatein{width:120px;font-size:24px;font-weight:800;text-align:center;border:3px solid #b2f2e2;border-radius:14px;padding:6px;font-family:var(--body);color:var(--ink);background:#fff}
.report{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 12px;font-weight:800}
.rrow .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.ichip{flex:0 0 auto;border:0;border-radius:16px;background:var(--soft);font-size:30px;width:58px;height:58px;cursor:pointer;padding:0}
.ichip.sel{background:#ffd43b;outline:3px solid var(--sea)}
.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;direction:ltr}
.key{border:0;border-radius:14px;height:130px;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;align-items:flex-end;justify-content:center;padding:0 0 10px;touch-action:manipulation;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@media (max-width:640px){.key{height:96px;font-size:14px}}
.key:active{transform:translateY(4px)}
.key.glow{outline:6px solid #fff;outline-offset:2px;animation:glow .8s infinite}
@keyframes glow{50%{outline-color:#ffd43b}}
.swatch2{border:0;border-radius:20px;width:110px;height:80px;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.stat{display:flex;flex-direction:column;gap:4px;font-weight:800}
.stat .meter{margin:0;max-width:none}
@media (prefers-reduced-motion:reduce){.key.glow{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-weight:800;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (max-width:560px){.bar{gap:5px}.ib{min-width:36px;height:36px;font-size:18px;padding:0 7px}.stars{font-size:15px;padding:2px 9px 2px 7px}.bar h1{font-size:18px}.lang{font-size:14px}}
@media (prefers-reduced-motion:reduce){.ans.no{animation:none}.tile{transition:none}}
</style>
</head>
<body>

<div id="app" dir="rtl">
  <header class="bar">
    <button class="ib" id="back" hidden>&#8594;</button>
    <h1 id="ttl">جزيرة ياسين</h1>
    <button class="ib" id="helpBtn">?</button>
    <button class="ib" id="parBtn" aria-label="parents">⚙️</button>
    <button class="ib" id="musBtn">🎵</button>
    <button class="ib lang" id="langBtn" aria-haspopup="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>ع</span></button>
    <div class="langmenu" id="langMenu" hidden><button data-l="ar" lang="ar">العربية</button><button data-l="fr" lang="fr">Français</button><button data-l="en" lang="en">English</button><button data-l="es" lang="es">Español</button></div>
    <button class="stars" id="starsBtn" aria-label="stars">⭐<span id="starN">0</span></button>
  </header>

  <div class="stage" id="stage"><canvas id="cv"></canvas></div>

  <section class="sheet" id="s-home"><div class="inner"><div class="mission" id="mission"></div><div class="tiles" id="homeGrid"></div></div></section>
  <section class="sheet" id="s-zone" hidden><div class="inner"><div class="tiles" id="zoneGrid"></div></div></section>
  <section class="sheet" id="s-feel" hidden><div class="inner"><div class="row" id="feelTabs"></div><div class="inner" id="feelPane"></div></div></section>
  <section class="sheet" id="s-move" hidden><div class="inner center"><p class="q" id="mvName"></p><p class="big" id="mvTime"></p><div class="meter"><i id="mvMeter"></i></div><div class="row" id="mvList"></div>
    <div class="row"><button class="candy" id="mvStart"></button><button class="candy alt" id="mvSkip" hidden></button></div></div></section>
  <section class="sheet" id="s-robot" hidden><div class="inner"><p class="q" id="rbLevel"></p><div class="prog" id="rbProg"></div>
    <div class="row" id="rbBtns"><button data-d="L" aria-label="left">⬅️</button><button data-d="U" aria-label="up">⬆️</button><button data-d="D" aria-label="down">⬇️</button><button data-d="R" aria-label="right">➡️</button><button class="candy" id="rbPlay" aria-label="play">▶</button><button class="candy alt" id="rbClear"></button></div>
    <p class="msg" id="rbMsg"></p><div class="row"><button class="candy" id="rbNext" hidden></button></div></div></section>
  <section class="sheet" id="s-routine" hidden><div class="inner"><div class="row" id="rtTabs"></div><div class="meter" id="rtMeterW"><i id="rtMeter"></i></div><div class="tasks" id="rtList"></div>
    <div class="inner center" id="rtTeeth" hidden><p class="q" id="rtTeethTip"></p><button class="candy" id="rtTeethBtn"></button></div></div></section>
  <section class="sheet" id="s-safe" hidden><div class="inner"><div class="dots" id="sfDots"></div><p class="q" id="sfQ"></p><div class="answers two" id="sfOpts"></div><p class="msg" id="sfWhy"></p>
    <div class="row"><button class="candy" id="sfNext" hidden></button></div><p class="tdesc" id="sfNums" style="font-size:14px"></p></div></section>
  <section class="sheet" id="s-math" hidden><div class="inner"><div class="dots" id="mtDots"></div><p class="q" id="mtQ"></p><div class="answers" id="mtOpts"></div><p class="msg" id="mtMsg"></p></div></section>
  <section class="sheet" id="s-treasure" hidden><div class="inner"><p class="q" id="trInfo"></p><div class="stkgrid" id="trGrid"></div><p class="tdesc" id="trHintP"></p></div></section>
  <section class="sheet" id="s-gate" hidden><div class="inner center"><p class="q" id="gateQ"></p><div class="row"><input id="gateIn" class="gatein" type="number" inputmode="numeric" aria-label="?"><button class="candy" id="gateOk"></button></div><p class="msg bad" id="gateMsg"></p></div></section>
  <section class="sheet" id="s-parent" hidden><div class="inner" id="parPane"></div></section>
  <section class="sheet" id="s-rest" hidden><div class="inner center"><p class="big" id="restT"></p><p class="q" id="restM"></p><div class="row"><button class="candy alt" id="restParent"></button></div></div></section>
  <section class="sheet" id="s-gen" hidden><div class="inner" id="genPane"></div></section>
  <input type="file" id="pzFile" accept="image/*" hidden>
  <section class="sheet" id="s-done" hidden><div class="inner center"><p class="big" id="doneT"></p><p class="q" id="doneS"></p><div class="row"><button class="candy" id="again"></button><button class="candy alt" id="back2"></button></div></div></section>
  <section class="sheet" id="s-guide" hidden><div class="inner"><ul class="glist" id="guideList"></ul></div></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const PI=Math.PI,BEAT0=0,BEAT=.6;const $=id=>document.getElementById(id);
const cv=$('cv');let c=cv.getContext('2d');let W=1600,H=1000,K=1;
let lang='ar';try{const l=localStorage.getItem('yas_lang');if(['fr','en','es'].includes(l))lang=l}catch(e){}
const L4=(ar,fr,en,es)=>({ar,fr,en,es});const tx=o=>o?(o[lang]||o.ar):'';
const UI={ar:{},fr:{},en:{},es:{}};function addUI(o){for(const k in o)for(const l of['ar','fr','en','es'])UI[l][k]=o[k][['ar','fr','en','es'].indexOf(l)]}
const T=(k,...a)=>{const v=UI[lang][k];return typeof v==='function'?v(...a):v};
addUI({
 app:['جزيرة ياسين','L’île de Yassine','Yassine’s Island','La isla de Yassine'],
 sub:['نستكشف ونتعلّم مع نجمة','On explore et on apprend avec Najma','Explore and learn with Najma','Exploramos y aprendemos con Najma'],
 soon:['قيد البناء','En construction','Coming soon','En construcción'],
 soonMsg:['هذا المكان قيد البناء… قريبًا!','Cet endroit est en construction… bientôt !','This place is being built… coming soon!','Este lugar está en construcción… ¡pronto!'],
 apps:[n=>`${n} ألعاب`,n=>`${n} jeux`,n=>`${n} games`,n=>`${n} juegos`],
 praise:[['أحسنت!','رائع!','ممتاز!'],['Bravo !','Super !','Excellent !'],['Well done!','Great!','Excellent!'],['¡Muy bien!','¡Genial!','¡Excelente!']],
 wrong:['حاول مرة أخرى!','Essaie encore !','Try again!','¡Inténtalo otra vez!'],
 result:['النتيجة','Résultat','Result','Resultado'],again:['العب مرة أخرى','Rejouer','Play again','Jugar otra vez'],backPlace:['العودة إلى المكان','Retour','Back','Volver'],
 score:[(s,n)=>`أجبت إجابة صحيحة عن ${s} من ${n}`,(s,n)=>`${s} bonnes réponses sur ${n}`,(s,n)=>`${s} out of ${n} correct`,(s,n)=>`${s} de ${n} correctas`],
 doneGood:['أحسنت!','Bravo !','Well done!','¡Muy bien!'],
 noTTS:['القراءة الصوتية غير متاحة على هذا الجهاز','Lecture vocale indisponible sur cet appareil','Voice reading isn’t available on this device','La lectura en voz alta no está disponible'],
 back:['رجوع','Retour','Back','Volver'],musicOn:['إيقاف الموسيقى','Couper la musique','Music off','Apagar música'],musicOff:['تشغيل الموسيقى','Mettre la musique','Music on','Encender música'],
 langBtn:['ع','FR','EN','ES'],next:['التالي','Suivant','Next','Siguiente'],start:['ابدأ','C’est parti','Start','Empezar'],guide:['دليل الجزيرة','Guide de l’île','Island guide','Guía de la isla'],
 tapPlace:['اختر مكانًا في الجزيرة','Choisis un endroit de l’île','Pick a place on the island','Elige un lugar de la isla']});

/* helpers */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const elastic=x=>{x=clamp(x);if(x===0||x===1)return x;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*PI/3))+1};
const pop=(t,t0,d=.6)=>elastic((t-t0)/d);const bounce=t=>Math.abs(Math.sin(PI*(t/BEAT)));

function openGate(){const a=3+Math.floor(Math.random()*6),b=3+Math.floor(Math.random()*6);gateAns=a*b;if(!['gate','parent'].includes(mode))beforeGate=mode;show('gate');$('gateQ').textContent=T('gateQ',a,b);$('gateIn').value='';$('gateMsg').textContent='';$('gateOk').textContent=T('ok');setTimeout(()=>$('gateIn').focus(),50)}
$('gateOk').onclick=()=>{if(+$('gateIn').value===gateAns){buildParent();show('parent')}else{$('gateMsg').textContent=T('wrongGate');sfx(false)}};
$('gateIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('gateOk').click()});
function buildParent(){rollDay();const p=$('parPane');p.innerHTML='';p.appendChild(el('p','q',T('limitTitle')));const r=el('div','row');[0,15,30,45,60,90].forEach(m=>{const b=el('button','chip',m?T('mins',m):T('noLimit'));b.setAttribute('aria-pressed',String(PAR.limit===m));b.onclick=()=>{PAR.limit=m;lsSet('yas_par',PAR);buildParent()};r.appendChild(b)});p.appendChild(r);
  p.appendChild(el('p','tdesc',T('usedToday',Math.round(PAR.secs/60))));const r2=el('div','row');const at=el('button','candy alt',T('addTime'));at.onclick=()=>{PAR.extra+=15;lsSet('yas_par',PAR);toast('＋15');buildParent()};r2.appendChild(at);
  const rs=el('button','candy alt',T('resetAll'));rs.onclick=()=>{if(rs.dataset.sure){stars=0;$('starN').textContent=0;TOT={};DAY={date:today(),apps:{},bonus:false};seenDeco=0;['yas_stars','yas_tot','yas_day','yas_deco'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});buildParent()}else{rs.dataset.sure='1';rs.textContent=T('confirm');setTimeout(()=>{delete rs.dataset.sure;rs.textContent=T('resetAll')},2500)}};r2.appendChild(rs);
  const dn=el('button','candy',T('done2'));dn.onclick=()=>go(overLimit()?'rest':(beforeGate==='rest'?'home':beforeGate));r2.appendChild(dn);p.appendChild(r2);
  p.appendChild(el('p','q',T('report')));const ids=Object.keys(APPS).filter(k=>TOT[k]).sort((a,b)=>TOT[b]-TOT[a]);if(!ids.length)p.appendChild(el('p','tdesc',T('repNone')));
  else{const tb=el('div','report');ids.forEach(id=>{const row=el('div','rrow');row.append(el('span','',APPS[id].e+' '+tx(APPS[id].n)),el('span','num',`${T('repToday')}: ${DAY.apps[id]||0}`),el('span','num',`${T('repTotal')}: ${TOT[id]}`));tb.appendChild(row)});p.appendChild(tb)}}
$('parBtn').onclick=openGate;$('restParent').onclick=openGate;$('starsBtn').onclick=()=>{if(mode!=='rest')go('treasure')};
setInterval(()=>{if(document.visibilityState!=='visible'||['rest','gate','parent'].includes(mode))return;rollDay();PAR.secs+=10;lsSet('yas_par',PAR);if(overLimit())go('rest')},10000);

/* ---------- guide ---------- */
const GUIDE=[
 {e:'🏝️',t:L4('الجزيرة','L’île','The island','La isla'),d:L4('اضغط على مكان في الخريطة أو على البطاقات تحتها: قرية ياسين، شاطئ المرح، غابة الحكايات، جبل الاكتشاف، وادي الاهتمام. في كل مكان ألعاب.','Touche un endroit sur la carte ou une carte en dessous : le village, la plage, la forêt, la montagne, la vallée. Chaque endroit a ses jeux.','Tap a place on the map or a card below it: the village, the beach, the forest, the mountain, the valley. Each place has its own games.','Toca un lugar del mapa o una tarjeta debajo: el pueblo, la playa, el bosque, la montaña, el valle. Cada lugar tiene sus juegos.')},
 {e:'⭐',t:L4('نجمة والنجوم','Najma et les étoiles','Najma and the stars','Najma y las estrellas'),d:L4('نجمة صديقة ياسين، نجمة صغيرة سقطت من السماء. كل جواب صحيح أو مهمة منجزة يعطيك نجومًا، وعددها في الأعلى.','Najma, l’amie de Yassine, est une petite étoile tombée du ciel. Chaque bonne réponse ou tâche réussie te donne des étoiles, comptées en haut.','Najma, Yassine’s friend, is a little star that fell from the sky. Every right answer or finished task gives you stars, counted at the top.','Najma, la amiga de Yassine, es una estrellita caída del cielo. Cada acierto o tarea hecha te da estrellas, que se cuentan arriba.')},
 {e:'😊',t:APPS.feel.n,d:L4('تعرّف على 6 مشاعر، العب «كيف يشعر ياسين؟»، وتنفّس بهدوء مع البالونة.','Découvre 6 émotions, joue à « Comment se sent Yassine ? » et respire calmement avec le ballon.','Discover 6 feelings, play “How does Yassine feel?” and breathe calmly with the balloon.','Descubre 6 emociones, juega a «¿Cómo se siente Yassine?» y respira tranquilo con el globo.')},
 {e:'⏰',t:APPS.routine.n,d:L4('علّم على مهامك في الصباح والمساء (نجمة لكل مهمة كل يوم)، واستعمل مؤقّت الأسنان لدقيقتين.','Coche tes tâches du matin et du soir (une étoile par tâche chaque jour) et utilise le minuteur de 2 minutes pour les dents.','Tick your morning and evening tasks (a star per task each day) and use the 2-minute tooth timer.','Marca tus tareas de la mañana y de la noche (una estrella por tarea cada día) y usa el temporizador de dientes de 2 minutos.')},
 {e:'🚦',t:APPS.safe.n,d:L4('8 مواقف: اختر التصرّف الآمن واقرأ لماذا. في الأسفل أرقام الطوارئ في المغرب.','8 situations : choisis le bon geste et lis pourquoi. En bas, les numéros d’urgence au Maroc.','8 situations: pick the safe choice and read why. Emergency numbers in Morocco are at the bottom.','8 situaciones: elige lo seguro y lee por qué. Abajo están los números de emergencia de Marruecos.')},
 {e:'🏃',t:APPS.move.n,d:L4('6 تمارين، كل واحد 20 ثانية. قلّد ياسين!','6 exercices de 20 secondes. Imite Yassine !','6 exercises of 20 seconds. Copy Yassine!','6 ejercicios de 20 segundos. ¡Imita a Yassine!')},
 {e:'🤖',t:APPS.robot.n,d:L4('أضف الأسهم ثم اضغط ▶ ليمشي الروبو حتى نجمة دون أن يصطدم بالصخور. 8 مستويات. اضغط على سهم في البرنامج لحذفه.','Ajoute des flèches puis touche ▶ pour que le robot rejoigne Najma sans toucher les rochers. 8 niveaux. Touche une flèche du programme pour l’enlever.','Add arrows then tap ▶ so the robot reaches Najma without hitting rocks. 8 levels. Tap an arrow in the program to remove it.','Añade flechas y toca ▶ para que el robot llegue hasta Najma sin chocar con las rocas. 8 niveles. Toca una flecha del programa para quitarla.')},

GUIDE2_ADD();
function buildGuide(){const box=$('guideList');box.innerHTML='';GUIDE.forEach(g=>{const li=document.createElement('li');const ic=document.createElement('div');ic.className='gic';ic.textContent=g.e;const d=document.createElement('div');const h=document.createElement('h3');h.textContent=tx(g.t);const p=document.createElement('p');p.textContent=tx(g.d);d.append(h,p);li.append(ic,d);box.appendChild(li)})}

/* ---------- navigation ---------- */
let mode='home';const SHEETS=['home','zone','feel','move','robot','routine','safe','math','done','guide','gen','treasure','gate','parent','rest'];const APPMODES=['feel','move','robot','routine','safe','math',...Object.keys(NA)];
function show(m){mode=m;const sh=NA[m]?'gen':m;SHEETS.forEach(k=>$('s-'+k).hidden=k!==sh);$('back').hidden=m==='home'||m==='rest';
  $('ttl').textContent=m==='home'?T('app'):m==='zone'?tx(curZone.n):APPMODES.includes(m)?tx(APPS[m].n):m==='done'?T('result'):m==='treasure'?T('treasure'):(m==='gate'||m==='parent')?T('parents'):m==='rest'?T('restTitle'):T('guide');
  setMood(['music','film','firstword','rest','gate','parent'].includes(m)?null:m==='treasure'?'home':m==='home'||m==='zone'?'home':['feel','routine','guide','stories','prayer','pet','garden','events','morocco','langs','lab'].includes(m)?'learn':m==='done'?'party':'play');resize()}
function go(m){if(!['rest','gate','parent'].includes(m)&&overLimit())m='rest';if(m!=='move')MV.on=false;if(m!=='feel')FL.br=null;if(m!=='routine'&&RTS.teeth&&!RTS.teeth.done)RTS.teeth=null;if('speechSynthesis' in window)speechSynthesis.cancel();MUS.duck=1;musicLevel();
  show(m);if(m==='home'){buildHome();buildMission()}if(m==='treasure')buildTreasure();if(m==='rest'){$('restT').textContent=T('restTitle');$('restM').textContent=T('restMsg');$('restParent').textContent=T('parents')}if(m==='zone')buildZone();if(m==='guide')buildGuide();if(m==='feel')buildFeel();if(m==='move')buildMove();if(m==='robot')buildRobot();if(m==='routine')buildRoutine();if(m==='safe')buildSafe();if(m==='math')buildMath();if(m==='family')FM=null;if(m==='stories'){ST.pg='p1';ST.qi=-1;ST.t0=now()}if(NA[m])NA[m].build()}
$('back').onclick=()=>go((mode==='gate'||mode==='parent')?(overLimit()?'rest':beforeGate):['zone','guide','treasure'].includes(mode)?'home':curZone?'zone':'home');
$('again').onclick=()=>go(lastApp||'home');$('back2').onclick=()=>go(curZone?'zone':'home');$('helpBtn').onclick=()=>go('guide');

/* ---------- language & music buttons ---------- */
function applyLang(){document.documentElement.lang=lang;$('app').dir=lang==='ar'?'rtl':'ltr';$('langBtn').querySelector('span').textContent=T('langBtn');
  document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.l===lang)));$('again').textContent=T('again');$('back2').textContent=T('backPlace');
  $('mvStart').textContent=T('start');$('mvSkip').textContent=T('next');$('rbNext').textContent=T('rbNext');$('back').innerHTML=lang==='ar'?'&#8594;':'&#8592;';$('back').setAttribute('aria-label',T('back'));$('helpBtn').setAttribute('aria-label',T('guide'));$('parBtn').setAttribute('aria-label',T('parents'));paintMusic()}
function paintMusic(){const b=$('musBtn');b.innerHTML=MUS.on?'🎵':'🔇';b.setAttribute('aria-label',MUS.on?T('musicOn'):T('musicOff'))}
$('musBtn').onclick=()=>{audioInit();MUS.on=!MUS.on;try{localStorage.setItem('yas_music',MUS.on?'on':'off')}catch(e){}musicLevel();paintMusic()};
$('langBtn').onclick=e=>{e.stopPropagation();$('langMenu').hidden=!$('langMenu').hidden};
document.querySelectorAll('#langMenu button').forEach(b=>b.onclick=()=>{$('langMenu').hidden=true;if(b.dataset.l===lang)return;lang=b.dataset.l;try{localStorage.setItem('yas_lang',lang)}catch(e){}applyLang();if(mode==='done')show('done');else if(mode==='parent'){buildParent();show('parent')}else if(mode==='gate')openGate();else go(mode)});
document.addEventListener('click',e=>{if(!e.target.closest('#langMenu')&&!e.target.closest('#langBtn'))$('langMenu').hidden=true});

/* ---------- loop ---------- */
function resize(){const r=$('stage').getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));K=cv.height/1000;W=cv.width/K;H=1000}
new ResizeObserver(resize).observe($('stage'));window.addEventListener('resize',resize);
function loop(){const t=now();c.setTransform(K,0,0,K,0,0);c.clearRect(0,0,W,H);
  try{if(mode==='home')drawIsland(t);else if(mode==='zone'&&curZone)drawZone(t);else if(mode==='feel')drawFeel(t);else if(mode==='move')drawMove(t);else if(mode==='robot')drawRobot(t);else if(mode==='routine')drawRoutine(t);else if(mode==='safe')drawSafe(t);else if(mode==='math')drawMath(t);else if(NA[mode])NA[mode].draw(t);
    else if(mode==='done'){vgrad(0,H,[[0,'#3bc9db'],[1,'#ffe8a3']]);confetti(t,0,90);yassine(W/2-Math.min(140,W*.12),930,Math.min(1,W/700),t,{jump:60*bounce(t),mood:'happy'});najma(W/2+Math.min(200,W*.18),420,.9,t)}
    else if(mode==='treasure'){drawIsland(t);label(T('treasure'),W/2,80,Math.min(70,W*.08),'#ffd43b','#0b3d4a')}
    else if(mode==='rest'){vgrad(0,H,[[0,'#ffb26b'],[.6,'#ffe0b2'],[1,'#b2f2bb']]);sun(W*.8,300,70,t);hill(760,30,1.2,.5,'#8ce99a');['🏃','💧','🌳','⚽'].forEach((e,i)=>emoji(e,W/2+(i-1.5)*Math.min(240,W*.2),300+20*Math.sin(t*2+i),Math.min(100,W*.11)));yassine(W/2,930,Math.min(1,W/700),t,{mood:'calm',wave:.05});najma(W/2+Math.min(240,W*.22),520,.7,t)}
    else if(mode==='gate'||mode==='parent'){zoneBg(ZONES[0],t);yassine(W/2-Math.min(120,W*.1),930,Math.min(1,W/700),t,{wave:.05})}
    else if(mode==='guide'){zoneBg(ZONES[0],t);yassine(W/2-Math.min(120,W*.1),930,Math.min(1,W/700),t,{});najma(W/2+Math.min(200,W*.18),380,.8,t)}
    if(t<fx.until&&mode!=='done')confetti(t,fx.start,80)}catch(e){console.error(e)}
  requestAnimationFrame(loop)}
$('starN').textContent=stars;applyLang();go('home');resize();requestAnimationFrame(loop);
